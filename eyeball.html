<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Watching Eye</title>
<style>
:root{--bg:#f3efe8;--fg:#222;--btn:#222;--btnfg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15151a;--fg:#eee;--btn:#eee;--btnfg:#111}}
:root[data-theme="dark"]{--bg:#15151a;--fg:#eee;--btn:#eee;--btnfg:#111}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;overflow:hidden;touch-action:none}
.eye{position:relative;width:min(82vw,380px);aspect-ratio:1;border-radius:50%;overflow:hidden;
background:radial-gradient(circle at 40% 35%,#fff 0,#f6f1ee 55%,#e3c9c4 100%);
box-shadow:inset 0 0 40px rgba(180,60,60,.35),0 20px 50px rgba(0,0,0,.35)}
.iris{position:absolute;left:50%;top:50%;width:46%;aspect-ratio:1;margin:-23% 0 0 -23%;border-radius:50%;
background:radial-gradient(circle,#000 0 28%,transparent 29%),radial-gradient(circle,#4fa36a 0,#2a7a58 45%,#14463a 75%,#0a2a22 100%);
box-shadow:0 0 0 3px rgba(0,0,0,.55);will-change:transform}
.iris::after{content:"";position:absolute;left:22%;top:18%;width:20%;height:20%;border-radius:50%;background:#fff;opacity:.9}
.lid{position:absolute;left:-5%;width:110%;height:52%;background:#c9967f;transition:transform .09s ease-in;z-index:2}
.lid.t{top:0;transform:translateY(-100%);border-bottom:4px solid #7a4a3a}
.lid.b{bottom:0;transform:translateY(100%);border-top:4px solid #7a4a3a}
.blink .lid.t{transform:translateY(0)}.blink .lid.b{transform:translateY(0)}
button{font:600 17px system-ui;padding:14px 28px;border:0;border-radius:999px;background:var(--btn);color:var(--btnfg)}
#msg{font-size:14px;opacity:.75;text-align:center;padding:0 20px;min-height:1.2em}
#cam{position:fixed;right:8px;bottom:8px;width:80px;height:60px;opacity:.01;pointer-events:none}
</style>
</head>
<body>
<div class="eye" id="eye"><div class="iris" id="iris"></div><div class="lid t"></div><div class="lid b"></div></div>
<button id="start">Start camera</button>
<div id="msg">Tap start, or drag your finger to move the eye.</div>
<video id="cam" width="160" height="120" playsinline muted autoplay></video>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tracking.js/1.1.3/tracking-min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tracking.js/1.1.3/data/face-min.js"></script>
<script>
(function(){
  var eye=document.getElementById('eye'), iris=document.getElementById('iris'),
      msg=document.getElementById('msg'), btn=document.getElementById('start'),
      cam=document.getElementById('cam');
  var tx=0, ty=0, x=0, y=0, lastFace=0, W=160, H=120;

  // smooth animation loop
  function frame(t){
    if(performance.now()-lastFace>2000){ // idle wander when no face
      tx=Math.sin(t/1700)*0.5; ty=Math.cos(t/2300)*0.3;
    }
    x+=(tx-x)*0.18; y+=(ty-y)*0.18;
    var r=eye.clientWidth*0.2, d=Math.hypot(x,y), k=d>1?1/d:1;
    iris.style.transform='translate('+(x*k*r)+'px,'+(y*k*r)+'px)';
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // random blinking
  (function blink(){
    eye.classList.add('blink');
    setTimeout(function(){eye.classList.remove('blink');},130);
    setTimeout(blink,2000+Math.random()*3500);
  })();

  // touch / mouse fallback
  function point(e){
    var p=e.touches?e.touches[0]:e, b=eye.getBoundingClientRect();
    tx=(p.clientX-(b.left+b.width/2))/(b.width/2)*1.2;
    ty=(p.clientY-(b.top+b.height/2))/(b.height/2)*1.2;
    lastFace=performance.now();
  }
  window.addEventListener('touchmove',point,{passive:true});
  window.addEventListener('mousemove',point);

  btn.onclick=function(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      msg.textContent='Camera not available here. Drag your finger instead.'; return;
    }
    msg.textContent='Requesting camera…';
    navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:320},height:{ideal:240}},audio:false})
    .then(function(stream){
      cam.srcObject=stream; return cam.play();
    }).then(function(){
      btn.style.display='none';
      msg.textContent='Looking for a face…';
      var tracker=new tracking.ObjectTracker('face');
      tracker.setInitialScale(2); tracker.setStepSize(1.5); tracker.setEdgesDensity(0.1);
      tracker.on('track',function(e){
        if(!e.data.length) return;
        var f=e.data.reduce(function(a,b){return b.width>a.width?b:a;});
        var cx=(f.x+f.width/2)/W, cy=(f.y+f.height/2)/H;
        tx=(0.5-cx)*3;          // mirrored: face moves right → eye looks right
        ty=(cy-0.5)*3;
        lastFace=performance.now();
        msg.textContent='Got you 👀';
      });
      tracking.track(cam,tracker);
    }).catch(function(err){
      msg.textContent='Camera blocked ('+(err.name||'error')+'). Drag your finger instead.';
    });
  };
})();
</script>
</body>
</html>
